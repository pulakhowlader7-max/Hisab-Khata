<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>আমার হিসাব খাতা</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="হিসাব খাতা">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f1; --card:#ffffff; --ink:#12302b; --muted:#5f7a74; --line:#dbe6e2;
  --brand:#0f766e; --brand-ink:#ffffff; --income:#15803d; --expense:#c2410c; --save:#1d4ed8;
  --warn:#b91c1c; --track:#e3ece9; --chip:#f3f7f6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1917; --card:#13262390; --card:#142724; --ink:#e6f2ef; --muted:#93b0a9; --line:#24403b;
    --brand:#2dd4bf; --brand-ink:#04211d; --income:#4ade80; --expense:#fb923c; --save:#7aa2ff;
    --warn:#f87171; --track:#1f3a35; --chip:#193330;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1917; --card:#142724; --ink:#e6f2ef; --muted:#93b0a9; --line:#24403b;
  --brand:#2dd4bf; --brand-ink:#04211d; --income:#4ade80; --expense:#fb923c; --save:#7aa2ff;
  --warn:#f87171; --track:#1f3a35; --chip:#193330;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:88px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 0}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font-size:20px;margin:0;font-weight:700}
.monthnav{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthnav button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;font-size:18px}
.monthnav span{min-width:104px;text-align:center;font-weight:600;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.hero{background:var(--brand);color:var(--brand-ink);border:0;padding:20px 18px}
.hero small{opacity:.85;font-size:14px}
.hero .big{font-size:38px;font-weight:700;line-height:1.15;margin:2px 0 12px}
.hero .row{display:flex;gap:8px}
.hero .pill{flex:1;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px}
.hero .pill b{display:block;font-size:17px}
.hero .pill span{font-size:12.5px;opacity:.9}
h2{font-size:16px;margin:0 0 10px;font-weight:700}
.bar{height:12px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .4s}
.bar.over i{background:var(--warn)}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:6px;gap:8px}
.meta b{color:var(--ink)}
.status{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:14.5px;background:var(--chip)}
.status.bad{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);font-weight:600}
.status.good{background:color-mix(in srgb,var(--income) 14%,transparent);color:var(--income);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--chip);border-radius:12px;padding:10px 12px}
.stat span{font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:19px}
.inc{color:var(--income)} .exp{color:var(--expense)} .sav{color:var(--save)}
.list .day{font-size:13.5px;color:var(--muted);font-weight:600;margin:14px 0 4px;display:flex;justify-content:space-between}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--chip);flex:none}
.tx .t{flex:1;min-width:0}
.tx .t b{display:block;font-weight:600}
.tx .t small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:700;white-space:nowrap}
.del{border:0;background:transparent;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:8px}
.del.sure{background:var(--warn);color:#fff}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center}
nav button.tab{border:0;background:transparent;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12.5px;color:var(--muted)}
nav button.tab .e{font-size:21px;line-height:1.2}
nav button.tab[aria-current="page"]{color:var(--brand);font-weight:700}
.fab{width:58px;height:58px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-size:32px;line-height:1;margin:-22px auto 0;box-shadow:0 6px 16px rgba(15,118,110,.35)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{border:0;background:transparent;padding:9px 4px;border-radius:10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg button[data-t="expense"][aria-pressed="true"]{color:var(--expense)}
.seg button[data-t="income"][aria-pressed="true"]{color:var(--income)}
.seg button[data-t="saving"][aria-pressed="true"]{color:var(--save)}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px;font-weight:500}
input[type=text],input[type=number],input[type=date],textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;min-height:46px}
.amt{font-size:26px!important;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:7px 13px;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.btn{width:100%;border:0;background:var(--brand);color:var(--brand-ink);padding:14px;border-radius:14px;font-weight:700;font-size:17px;margin-top:16px}
.btn.alt{background:var(--chip);color:var(--ink);border:1px solid var(--line);margin-top:8px;font-size:15px;padding:11px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none}
.sheet-bg.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet .top button{border:0;background:var(--chip);width:36px;height:36px;border-radius:50%;font-size:18px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%}
.toast.on{opacity:1}
.catrow{margin-bottom:12px}
.catrow .h{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
.days{display:flex;align-items:flex-end;gap:6px;height:130px;position:relative;padding-top:6px}
.days .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.days .col i{display:block;width:100%;background:var(--brand);border-radius:6px 6px 2px 2px;min-height:2px}
.days .col i.over{background:var(--warn)}
.days .col span{font-size:11.5px;color:var(--muted)}
.days .limit{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.7}
.hint{font-size:13.5px;color:var(--muted)}
.tabpane{display:none}.tabpane.on{display:block}
textarea.bk{min-height:90px;font-size:12px;font-family:monospace}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>💰 আমার হিসাব খাতা</h1>
    <div class="monthnav">
      <button id="prev" aria-label="আগের মাস">‹</button>
      <span id="mlabel"></span>
      <button id="next" aria-label="পরের মাস">›</button>
    </div>
  </header>

  <!-- হোম -->
  <section class="tabpane on" id="p-home"></section>
  <!-- লেনদেন -->
  <section class="tabpane" id="p-list"></section>
  <!-- রিপোর্ট -->
  <section class="tabpane" id="p-report"></section>
  <!-- সেটিংস -->
  <section class="tabpane" id="p-set"></section>
</div>

<nav aria-label="প্রধান মেনু"><div class="in">
  <button class="tab" data-tab="home" aria-current="page"><span class="e">🏠</span>হোম</button>
  <button class="tab" data-tab="list"><span class="e">🧾</span>লেনদেন</button>
  <button class="fab" id="fab" aria-label="নতুন হিসাব যোগ করুন">+</button>
  <button class="tab" data-tab="report"><span class="e">📊</span>রিপোর্ট</button>
  <button class="tab" data-tab="set"><span class="e">⚙️</span>সেটিংস</button>
</div></nav>

<div class="sheet-bg" id="bg"><div class="sheet" role="dialog" aria-label="হিসাব যোগ করুন">
  <div class="top"><h2 id="sheetTitle" style="margin:0">নতুন হিসাব</h2><button id="close" aria-label="বন্ধ করুন">✕</button></div>
  <div class="seg" id="seg">
    <button data-t="expense" aria-pressed="true">💸 খরচ</button>
    <button data-t="saving" aria-pressed="false">🏦 জমা</button>
    <button data-t="income" aria-pressed="false">💵 আয়</button>
  </div>
  <label for="amount">টাকার পরিমাণ</label>
  <input id="amount" class="amt" type="number" inputmode="numeric" min="1" placeholder="০">
  <div class="chips" id="quick" style="margin-top:8px"></div>
  <label>ধরন</label>
  <div class="chips" id="cats"></div>
  <label for="date">তারিখ</label>
  <input id="date" type="date">
  <label for="note">নোট (ঐচ্ছিক)</label>
  <input id="note" type="text" placeholder="যেমন: চা-নাস্তা, রিচার্জ">
  <button class="btn" id="save">সংরক্ষণ করুন</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var KEY="hisab-khata-v1";
var dip=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dip=e;});
var CATS={
  expense:[["rent","🏠","বাসাভাড়া"],["gas","🔥","গ্যাস বিল"],["elec","💡","বিদ্যুৎ বিল"],["pocket","🚶","হাত খরচ"],["food","🛒","বাজার"],["other","📦","অন্যান্য"]],
  saving:[["saving","🏦","জমা"],["dps","🐖","ডিপিএস/সঞ্চয়"]],
  income:[["salary","💼","বেতন"],["extra","✨","অতিরিক্ত আয়"],["gift","🎁","উপহার/অন্যান্য"]]
};
var TYPE_LABEL={expense:"খরচ",saving:"জমা",income:"আয়"};
var mem=null;
function load(){
  try{var r=localStorage.getItem(KEY); if(r) return JSON.parse(r);}catch(e){}
  return mem;
}
function persist(){
  mem=state;
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
}
var state=load()||{settings:{salary:17000,budget:7000,daily:70},tx:[]};
if(!state.settings)state.settings={salary:17000,budget:7000,daily:70};
if(!state.tx)state.tx=[];
if(!state.rec)state.rec=[];
if(!state.gen)state.gen={};
if(state.settings.remind==null)state.settings.remind=21;
function autoAdd(){
  var now=new Date(),p=now.getFullYear()+"-"+pad(now.getMonth()+1),changed=false,dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  state.rec.forEach(function(r){
    var k=r.id+":"+p,day=Math.min(r.day,dim);
    if(now.getDate()>=day&&!state.gen[k]){
      state.tx.push({id:Date.now()+Math.floor(Math.random()*100000),date:p+"-"+pad(day),type:"expense",cat:r.cat,amt:r.amt,note:"স্বয়ংক্রিয় মাসিক খরচ"});
      state.gen[k]=1;changed=true;
    }
  });
  if(changed)persist();
  return changed;
}

function bn(n){return Number(Math.round(n)).toLocaleString("bn-BD");}
function tk(n){return "৳"+bn(n);}
function pad(n){return (n<10?"0":"")+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
var today=new Date();
var view=new Date(today.getFullYear(),today.getMonth(),1);
function ym(d){return d.getFullYear()+"-"+pad(d.getMonth()+1);}
function catInfo(type,id){
  var l=CATS[type]||[];for(var i=0;i<l.length;i++)if(l[i][0]===id)return l[i];
  return [id,"📦",id];
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function $(id){return document.getElementById(id);}

function monthData(){
  var p=ym(view), s=state.settings;
  var tx=state.tx.filter(function(t){return t.date.slice(0,7)===p;});
  var exp=0,sav=0,inc=0,pocket=0,byCat={};
  tx.forEach(function(t){
    if(t.type==="expense"){exp+=t.amt;byCat[t.cat]=(byCat[t.cat]||0)+t.amt;if(t.cat==="pocket")pocket+=t.amt;}
    else if(t.type==="saving")sav+=t.amt;
    else inc+=t.amt;
  });
  var totalIncome=s.salary+inc;
  return {tx:tx,exp:exp,sav:sav,extra:inc,income:totalIncome,left:totalIncome-exp-sav,pocket:pocket,byCat:byCat};
}
function daysInMonth(d){return new Date(d.getFullYear(),d.getMonth()+1,0).getDate();}
function isCurrent(){return ym(view)===ym(today);}

function pct(a,b){return b>0?Math.min(100,Math.round(a/b*100)):0;}

function renderHome(){
  var s=state.settings,m=monthData(),dim=daysInMonth(view);
  var budgetLeft=s.budget-m.exp;
  var planSave=s.salary-s.budget;
  var td=iso(today);
  var todayPocket=state.tx.filter(function(t){return t.date===td&&t.type==="expense"&&t.cat==="pocket";}).reduce(function(a,t){return a+t.amt;},0);
  var h='<div class="card hero"><small>হাতে আছে (আয় − খরচ − জমা)</small><div class="big">'+tk(m.left)+'</div><div class="row">'+
    '<div class="pill"><b>'+tk(m.income)+'</b><span>মোট আয়</span></div>'+
    '<div class="pill"><b>'+tk(m.exp)+'</b><span>মোট খরচ</span></div>'+
    '<div class="pill"><b>'+tk(m.sav)+'</b><span>জমা</span></div></div></div>';

  // রিমাইন্ডার
  if(isCurrent()&&s.remind>0&&today.getHours()>=s.remind){
    var wrote=state.tx.some(function(t){return t.date===td&&t.type==="expense";});
    if(!wrote)h+='<div class="card" style="border-color:var(--warn)"><b>🔔 আজকের খরচ এখনো লেখা হয়নি</b><div class="hint">হাত খরচ না থাকলে ০ ভাবুন, না হলে ➕ চেপে এখনই লিখে ফেলুন।</div></div>';
  }
  // মাসিক বাজেট
  var over=m.exp>s.budget;
  h+='<div class="card"><h2>📅 মাসের খরচ বাজেট</h2><div class="bar'+(over?' over':'')+'"><i style="width:'+pct(m.exp,s.budget)+'%"></i></div>'+
    '<div class="meta"><span>খরচ <b>'+tk(m.exp)+'</b></span><span>বাজেট <b>'+tk(s.budget)+'</b></span></div>'+
    '<div class="status '+(over?'bad':'good')+'">'+(over?'⚠️ বাজেটের চেয়ে '+tk(m.exp-s.budget)+' বেশি খরচ হয়ে গেছে!':'✅ বাজেটের মধ্যে আছেন, আরও '+tk(budgetLeft)+' খরচ করা যাবে')+'</div>';
  if(isCurrent()){
    var dl=dim-today.getDate()+1;
    if(budgetLeft>0)h+='<p class="hint" style="margin:10px 0 0">মাসের বাকি '+bn(dl)+' দিনে গড়ে দিনে '+tk(budgetLeft/dl)+' খরচ করতে পারেন।</p>';
  }
  h+='</div>';

  // আজকের হাত খরচ
  if(isCurrent()){
    var o2=todayPocket>s.daily;
    h+='<div class="card"><h2>🚶 আজকের হাত খরচ</h2><div class="bar'+(o2?' over':'')+'"><i style="width:'+pct(todayPocket,s.daily)+'%"></i></div>'+
    '<div class="meta"><span>আজ <b>'+tk(todayPocket)+'</b></span><span>দৈনিক সীমা <b>'+tk(s.daily)+'</b></span></div>'+
    '<div class="status '+(o2?'bad':'good')+'">'+(o2?'⚠️ আজ সীমার চেয়ে '+tk(todayPocket-s.daily)+' বেশি খরচ হয়েছে':'✅ আজ আরও '+tk(s.daily-todayPocket)+' খরচ করতে পারবেন')+'</div></div>';
  }

  // সঞ্চয়
  var svPct=pct(m.sav,planSave>0?planSave:1);
  h+='<div class="card"><h2>🏦 সঞ্চয়</h2><div class="grid2">'+
    '<div class="stat"><span>এ মাসে জমা</span><b class="sav">'+tk(m.sav)+'</b></div>'+
    '<div class="stat"><span>লক্ষ্য (বেতন − বাজেট)</span><b>'+tk(Math.max(planSave,0))+'</b></div></div>'+
    (planSave>0?'<div class="bar" style="margin-top:12px"><i style="width:'+svPct+'%;background:var(--save)"></i></div><div class="meta"><span>লক্ষ্যের '+bn(svPct)+'% পূরণ</span><span>বাকি <b>'+tk(Math.max(planSave-m.sav,0))+'</b></span></div>':'')+
    '</div>';

  if(!m.tx.length){
    h+='<div class="empty"><b>এখনো কোনো হিসাব নেই</b>নিচের ➕ বোতাম চেপে আজকের প্রথম খরচ লিখুন।</div>';
  }
  $("p-home").innerHTML=h;
}

function txRow(t){
  var c=catInfo(t.type,t.cat);
  var sign=t.type==="income"?"+":"−";
  var cls=t.type==="income"?"inc":(t.type==="saving"?"sav":"exp");
  return '<div class="tx"><div class="ico">'+c[1]+'</div><div class="t"><b>'+esc(c[2])+'</b><small>'+esc(t.note||TYPE_LABEL[t.type])+'</small></div>'+
    '<div class="a '+cls+'">'+sign+tk(t.amt)+'</div><button class="del" data-del="'+t.id+'" aria-label="মুছুন">🗑</button></div>';
}
function dayLabel(d){
  var dt=new Date(d+"T00:00:00");
  return dt.toLocaleDateString("bn-BD",{weekday:"long",day:"numeric",month:"long"});
}
var filter="all";
function renderList(){
  var m=monthData(),items=m.tx.slice().sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:b.id-a.id);});
  if(filter!=="all")items=items.filter(function(t){return t.type===filter;});
  var h='<div class="chips" style="margin-bottom:10px">'+[["all","সব"],["expense","খরচ"],["saving","জমা"],["income","আয়"]].map(function(f){
    return '<button class="chip" data-filter="'+f[0]+'" aria-pressed="'+(filter===f[0])+'">'+f[1]+'</button>';}).join("")+'</div>';
  if(!items.length){h+='<div class="card empty"><b>কিছু পাওয়া যায়নি</b>এই মাসে এই ধরনের কোনো হিসাব নেই।</div>';}
  else{
    h+='<div class="card list">';
    var cur="";
    items.forEach(function(t){
      if(t.date!==cur){
        cur=t.date;
        var dsum=items.filter(function(x){return x.date===cur&&x.type==="expense";}).reduce(function(a,x){return a+x.amt;},0);
        h+='<div class="day"><span>'+dayLabel(cur)+'</span><span>'+(dsum?'খরচ '+tk(dsum):'')+'</span></div>';
      }
      h+=txRow(t);
    });
    h+='</div>';
  }
  $("p-list").innerHTML=h;
}

function renderReport(){
  var s=state.settings,m=monthData(),h="";
  // ক্যাটাগরি অনুযায়ী
  h+='<div class="card"><h2>খাত অনুযায়ী খরচ</h2>';
  var keys=Object.keys(m.byCat).sort(function(a,b){return m.byCat[b]-m.byCat[a];});
  if(!keys.length)h+='<p class="hint">এ মাসে কোনো খরচ লেখা হয়নি।</p>';
  keys.forEach(function(k){
    var c=catInfo("expense",k);
    h+='<div class="catrow"><div class="h"><span>'+c[1]+' '+esc(c[2])+'</span><b>'+tk(m.byCat[k])+' <span class="hint">('+bn(pct(m.byCat[k],m.exp))+'%)</span></b></div><div class="bar"><i style="width:'+pct(m.byCat[k],m.exp)+'%"></i></div></div>';
  });
  h+='</div>';

  // শেষ ৭ দিনের হাত খরচ
  var end=isCurrent()?new Date(today.getFullYear(),today.getMonth(),today.getDate()):new Date(view.getFullYear(),view.getMonth(),daysInMonth(view));
  var cols=[],mx=s.daily;
  for(var i=6;i>=0;i--){
    var d=new Date(end.getFullYear(),end.getMonth(),end.getDate()-i),k=iso(d);
    var v=state.tx.filter(function(t){return t.date===k&&t.type==="expense"&&t.cat==="pocket";}).reduce(function(a,t){return a+t.amt;},0);
    cols.push({d:d,v:v});if(v>mx)mx=v;
  }
  h+='<div class="card"><h2>শেষ ৭ দিনের হাত খরচ</h2><div class="days">';
  if(s.daily>0)h+='<div class="limit" style="bottom:calc('+(s.daily/mx*100)+'% * .78 + 21px)"></div>';
  cols.forEach(function(c){
    h+='<div class="col"><i class="'+(c.v>s.daily?'over':'')+'" style="height:'+(mx?c.v/mx*78:0)+'%" title="'+tk(c.v)+'"></i><span>'+bn(c.d.getDate())+'</span></div>';
  });
  h+='</div><p class="hint" style="margin:10px 0 0">ড্যাশ দেওয়া রেখাটি আপনার দৈনিক সীমা ('+tk(s.daily)+')। লাল দাগ মানে সীমা পার হয়েছে।</p></div>';

  // মাসের সারাংশ
  var dim=daysInMonth(view),over=0;
  var pk={};state.tx.forEach(function(t){if(t.date.slice(0,7)===ym(view)&&t.type==="expense"&&t.cat==="pocket")pk[t.date]=(pk[t.date]||0)+t.amt;});
  Object.keys(pk).forEach(function(k){if(pk[k]>s.daily)over++;});
  var used=Object.keys(pk).length;
  h+='<div class="card"><h2>মাসের সারাংশ</h2><div class="grid2">'+
   '<div class="stat"><span>মোট হাত খরচ</span><b>'+tk(m.pocket)+'</b></div>'+
   '<div class="stat"><span>দৈনিক গড় হাত খরচ</span><b>'+tk(used?m.pocket/used:0)+'</b></div>'+
   '<div class="stat"><span>সীমা পার করা দিন</span><b class="'+(over?'exp':'inc')+'">'+bn(over)+' দিন</b></div>'+
   '<div class="stat"><span>জমার হার (আয়ের)</span><b class="sav">'+bn(m.income?m.sav/m.income*100:0)+'%</b></div></div></div>';
  $("p-report").innerHTML=h;
}

function renderSet(){
  var s=state.settings;
  var h='<div class="card"><h2>মাসিক হিসাবের সেটিং</h2>'+
   '<label for="s-sal">মাসিক বেতন (টাকা)</label><input id="s-sal" type="number" inputmode="numeric" value="'+s.salary+'">'+
   '<label for="s-bud">মাসিক খরচের বাজেট (বাসাভাড়া + বিল + হাত খরচ)</label><input id="s-bud" type="number" inputmode="numeric" value="'+s.budget+'">'+
   '<label for="s-day">দৈনিক হাত খরচের সীমা (টাকা)</label><input id="s-day" type="number" inputmode="numeric" value="'+s.daily+'">'+
   '<p class="hint">বেতন − বাজেট = '+tk(Math.max(s.salary-s.budget,0))+' আপনার সঞ্চয়ের লক্ষ্য।</p>'+
   '<label for="s-rem">রিমাইন্ডার (এই সময়ের পর খরচ না লিখলে হোমে সতর্কতা দেখাবে)</label><select id="s-rem" style="width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;min-height:46px">'+
     [[0,"বন্ধ"],[20,"রাত ৮টা"],[21,"রাত ৯টা"],[22,"রাত ১০টা"]].map(function(o){return '<option value="'+o[0]+'"'+(s.remind===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join("")+'</select>'+
   '<button class="btn" id="s-save">সেটিং সংরক্ষণ করুন</button></div>';
  var catOpts=CATS.expense.map(function(c){return '<option value="'+c[0]+'">'+c[1]+' '+c[2]+'</option>';}).join("");
  var fld='style="width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;min-height:46px"';
  h+='<div class="card"><h2>🔁 প্রতি মাসের নির্দিষ্ট খরচ</h2><p class="hint">বাসাভাড়া, গ্যাস বা বিদ্যুৎ বিল একবার সেট করলে প্রতি মাসে নির্ধারিত তারিখে নিজে নিজে খরচ হিসেবে যোগ হবে (অ্যাপ খোলার সময়)।</p>';
  if(!state.rec.length)h+='<p class="hint">এখনো কিছু সেট করা নেই।</p>';
  state.rec.forEach(function(r){var c=catInfo("expense",r.cat);
    h+='<div class="tx"><div class="ico">'+c[1]+'</div><div class="t"><b>'+esc(c[2])+'</b><small>প্রতি মাসের '+bn(r.day)+' তারিখে</small></div><div class="a exp">'+tk(r.amt)+'</div><button class="del" data-rdel="'+r.id+'" aria-label="মুছুন">🗑</button></div>';});
  h+='<label for="r-cat">খাত</label><select id="r-cat" '+fld+'>'+catOpts+'</select>'+
     '<label for="r-amt">টাকা</label><input id="r-amt" type="number" inputmode="numeric" placeholder="যেমন: ৩০০০">'+
     '<label for="r-day">প্রতি মাসের কত তারিখে (১–৩১)</label><input id="r-day" type="number" inputmode="numeric" min="1" max="31" placeholder="যেমন: ৫">'+
     '<button class="btn alt" id="r-add">➕ যোগ করুন</button></div>';
  h+='<div class="card"><h2>📲 ফোনের হোম স্ক্রিনে রাখুন</h2><div class="status '+((window.matchMedia&&matchMedia("(display-mode: standalone)").matches)?'good':'bad')+'">'+((window.matchMedia&&matchMedia("(display-mode: standalone)").matches)?'✅ এখন অ্যাপ হিসেবে চলছে':'⚠️ এখন ব্রাউজারে খোলা আছে, অ্যাপ হিসেবে নয়')+'</div><button class="btn" id="inst-btn" style="margin-bottom:12px">📲 অ্যাপ ইনস্টল করুন</button><p class="hint" style="margin:0 0 6px"><b>Android (Chrome):</b> ওপরের ডান কোণের ⋮ মেনু → "Add to Home screen" বা "Install app"।</p><p class="hint" style="margin:0"><b>iPhone (Safari):</b> নিচের Share বোতাম → "Add to Home Screen"।</p></div>';
  h+='<div class="card"><h2>🎨 থিম</h2><div class="chips">'+
   '<button class="chip" data-theme="auto">স্বয়ংক্রিয়</button><button class="chip" data-theme="light">☀️ হালকা</button><button class="chip" data-theme="dark">🌙 গাঢ়</button></div></div>';
  h+='<div class="card"><h2>💾 ব্যাকআপ ও রিস্টোর</h2><p class="hint">আপনার তথ্য শুধু এই ব্রাউজারে জমা থাকে। মাঝেমধ্যে ব্যাকআপ কপি করে কোথাও (যেমন নোটে বা মেসেজে) রেখে দিন।</p>'+
   '<button class="btn alt" id="b-copy">📋 ব্যাকআপ কপি করুন</button>'+
   '<label for="b-text">রিস্টোর করতে ব্যাকআপ এখানে পেস্ট করুন</label><textarea id="b-text" class="bk"></textarea>'+
   '<button class="btn alt" id="b-restore">♻️ রিস্টোর করুন</button>'+
   '<button class="btn alt" id="b-clear" style="color:var(--warn)">সব তথ্য মুছে ফেলুন</button></div>';
  $("p-set").innerHTML=h;
}

function renderAll(){
  $("mlabel").textContent=view.toLocaleDateString("bn-BD",{month:"long",year:"numeric"});
  renderHome();renderList();renderReport();renderSet();
}

// ট্যাব
document.querySelectorAll("nav .tab").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll("nav .tab").forEach(function(x){x.removeAttribute("aria-current");});
    b.setAttribute("aria-current","page");
    document.querySelectorAll(".tabpane").forEach(function(p){p.classList.remove("on");});
    $("p-"+b.dataset.tab).classList.add("on");
    window.scrollTo(0,0);
  });
});
$("prev").onclick=function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);renderAll();};
$("next").onclick=function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);renderAll();};

// টোস্ট
var tt;function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on");},2200);}

// শিট
var form={type:"expense",cat:"pocket"};
function drawForm(){
  document.querySelectorAll("#seg button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.t===form.type));});
  $("cats").innerHTML=CATS[form.type].map(function(c){return '<button class="chip" data-cat="'+c[0]+'" aria-pressed="'+(form.cat===c[0])+'">'+c[1]+' '+c[2]+'</button>';}).join("");
  var q=form.type==="expense"?[10,20,30,50,70,100]:[500,1000,2000,5000];
  $("quick").innerHTML=q.map(function(n){return '<button class="chip" data-q="'+n+'">'+bn(n)+'</button>';}).join("");
}
function openSheet(){
  form.type="expense";form.cat="pocket";
  $("amount").value="";$("note").value="";$("date").value=iso(isCurrent()?today:new Date(view.getFullYear(),view.getMonth(),1));
  drawForm();$("bg").classList.add("on");setTimeout(function(){$("amount").focus();},50);
}
function closeSheet(){$("bg").classList.remove("on");}
$("fab").onclick=openSheet;$("close").onclick=closeSheet;
$("bg").addEventListener("click",function(e){if(e.target===$("bg"))closeSheet();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});
$("seg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;form.type=b.dataset.t;form.cat=CATS[form.type][0][0];if(form.type==="expense")form.cat="pocket";drawForm();});
$("cats").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;form.cat=b.dataset.cat;drawForm();});
$("quick").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;$("amount").value=b.dataset.q;});
$("save").onclick=function(){
  var a=Math.round(Number($("amount").value));
  if(!(a>0)){toast("⚠️ সঠিক টাকার পরিমাণ লিখুন");$("amount").focus();return;}
  var d=$("date").value||iso(today);
  state.tx.push({id:Date.now(),date:d,type:form.type,cat:form.cat,amt:a,note:$("note").value.trim()});
  persist();
  var dm=new Date(d+"T00:00:00");view=new Date(dm.getFullYear(),dm.getMonth(),1);
  closeSheet();renderAll();
  toast("✅ "+TYPE_LABEL[form.type]+" সংরক্ষণ হয়েছে");
};

// লেনদেন তালিকা (ডিলিট, ফিল্টার)
var pendingDel=null;
$("p-list").addEventListener("click",function(e){
  var f=e.target.closest("[data-filter]");
  if(f){filter=f.dataset.filter;renderList();return;}
  var d=e.target.closest("[data-del]");
  if(d){
    var id=Number(d.dataset.del);
    if(pendingDel===id){
      state.tx=state.tx.filter(function(t){return t.id!==id;});pendingDel=null;persist();renderAll();toast("🗑 মুছে ফেলা হয়েছে");
    }else{
      pendingDel=id;d.classList.add("sure");d.textContent="নিশ্চিত?";
      setTimeout(function(){if(pendingDel===id){pendingDel=null;renderList();}},3000);
    }
  }
});

// সেটিংস
$("p-set").addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.id==="s-save"){
    var sal=Number($("s-sal").value),bud=Number($("s-bud").value),day=Number($("s-day").value);
    if(!(sal>=0)||!(bud>=0)||!(day>=0)){toast("⚠️ সঠিক সংখ্যা দিন");return;}
    state.settings={salary:Math.round(sal),budget:Math.round(bud),daily:Math.round(day),remind:Number($("s-rem").value)};
    persist();renderAll();toast("✅ সেটিং সংরক্ষণ হয়েছে");
  }else if(t.id==="inst-btn"){
    if(dip){dip.prompt();dip=null;}else{toast("⚠️ ব্রাউজার এখনো ইনস্টলের অনুমতি দেয়নি, নিচের ধাপ দেখুন");}
  }else if(t.id==="r-add"){
    var ra=Math.round(Number($("r-amt").value)),rd=Math.round(Number($("r-day").value));
    if(!(ra>0)||!(rd>=1&&rd<=31)){toast("⚠️ টাকা ও তারিখ (১–৩১) সঠিক দিন");return;}
    state.rec.push({id:"r"+Date.now(),cat:$("r-cat").value,amt:ra,day:rd});
    persist();var added=autoAdd();renderAll();
    toast(added?"✅ যোগ হয়েছে ও এ মাসের খরচে ধরা হয়েছে":"✅ প্রতি মাসের খরচ যোগ হয়েছে");
  }else if(t.dataset.rdel){
    state.rec=state.rec.filter(function(r){return r.id!==t.dataset.rdel;});
    persist();renderAll();toast("🗑 মুছে ফেলা হয়েছে");
  }else if(t.dataset.theme){
    var r=document.documentElement;
    if(t.dataset.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t.dataset.theme);
  }else if(t.id==="b-copy"){
    var txt=JSON.stringify(state);
    var done=function(){toast("📋 ব্যাকআপ কপি হয়েছে");};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){$("b-text").value=txt;$("b-text").select();toast("নিচের বক্সের লেখা কপি করুন");});}
    else{$("b-text").value=txt;$("b-text").select();toast("নিচের বক্সের লেখা কপি করুন");}
  }else if(t.id==="b-restore"){
    try{
      var o=JSON.parse($("b-text").value);
      if(!o.settings||!Array.isArray(o.tx))throw 0;
      state=o;if(!state.rec)state.rec=[];if(!state.gen)state.gen={};if(state.settings.remind==null)state.settings.remind=21;
      persist();autoAdd();renderAll();toast("♻️ রিস্টোর সম্পন্ন");
    }catch(x){toast("⚠️ ব্যাকআপটি সঠিক নয়");}
  }else if(t.id==="b-clear"){
    if(t.dataset.sure){state={settings:state.settings,tx:[]};persist();renderAll();toast("সব লেনদেন মুছে ফেলা হয়েছে");}
    else{t.dataset.sure="1";t.textContent="আবার চাপুন — সব লেনদেন মুছে যাবে";setTimeout(function(){renderSet();},3500);}
  }
});

var addedOnOpen=autoAdd();
renderAll();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}}
if(addedOnOpen)toast("🔁 এ মাসের নির্দিষ্ট খরচ যোগ হয়েছে");
document.addEventListener("visibilitychange",function(){
  if(!document.hidden){today=new Date();if(autoAdd())toast("🔁 এ মাসের নির্দিষ্ট খরচ যোগ হয়েছে");renderAll();}
});
})();
</script>
</body>
</html>
